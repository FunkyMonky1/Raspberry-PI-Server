# Override datasource with H2 for all @SpringBootTest tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dummy admin credentials
app.admin.username=testuser
app.admin.password=testpass

# Use a temp folder for file storage
storage.location=./test_server_files

# Disable schema.sql — it contains MySQL-specific syntax; Hibernate creates the schema instead
spring.sql.init.mode=never
