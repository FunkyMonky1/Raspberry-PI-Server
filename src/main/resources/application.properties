spring.application.name=pi

server.port=8088
server.address=0.0.0.0

# -------------------------
# FILE UPLOAD LIMITS
# -------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# -------------------------
# DATABASE (ENV-BASED, SAFE)
# -------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloud_storage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Rapunzel1108+}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------
# STORAGE
# -------------------------
storage.location=${STORAGE_LOCATION:./server_files}

# -------------------------
# ADMIN LOGIN
# -------------------------
app.admin.username=${ADMIN_USER:felix}
app.admin.password=${ADMIN_PASSWORD:fds2014}
